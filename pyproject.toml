[project]
name = "kemp"
version = "0.1.0"
description = "Kemp challenge hackathon project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Add runtime deps here and note the reason in LOG.md, e.g. "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kemp"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
