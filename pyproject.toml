[project]
name = "kemp"
version = "0.1.0"
description = "Kemp challenge hackathon project"
readme = "README.md"
requires-python = ">=3.10"
# Add deps with `uv add <pkg>` (it updates uv.lock too) and give the reason in a log/ entry.
dependencies = []

[dependency-groups]
dev = [
    "nbstripout>=0.7",
    "pre-commit>=3.7,<4.6.1",  # 4.6.1+ needs git >= 2.31 (`ls-files --deduplicate`); keeps git 2.25 (Ubuntu 20.04) working
    "pre-commit-hooks>=4.6",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kemp"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
