<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 1000 584" width="1000" height="584" role="img" aria-label="Table-chart comparing catalytic base, aromatic contact and hydrogen-bond donors of each Kemp eliminase design against its best published catalytic efficiency"><style>
.viz{--surface:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--t3:#6f6e69;--grid:#ecebe7;--axis:#d3d2cd;
  --s-asp:#2a78d6;--s-glu:#eb6834;--s-his:#1baf7a;--s-unk:#9b9a95}
