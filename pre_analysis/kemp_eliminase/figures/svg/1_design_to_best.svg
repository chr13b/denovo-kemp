<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 900 672" width="900" height="672" role="img" aria-label="Dumbbell chart of kcat/KM from the original design to the best variant for each Kemp eliminase design, grouped by directed evolution versus computational-only optimisation"><style>
.viz{--surface:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--t3:#6f6e69;--grid:#ecebe7;--axis:#d3d2cd;
  --s-asp:#2a78d6;--s-glu:#eb6834;--s-his:#1baf7a;--s-unk:#9b9a95}
