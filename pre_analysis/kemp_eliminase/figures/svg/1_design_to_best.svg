.viz .ref{stroke:var(--axis);stroke-width:1;fill:none}
</style><rect class="bg" width="900" height="672"/><text x="14" y="26" class="t1" font-size="15" font-weight="600">From published design to best variant</text><text x="14" y="45" class="t2" font-size="12" >kcat/KM, M⁻¹ s⁻¹ (log scale). Colour = catalytic base. Values and sources: see the table view.</text><circle cx="14" cy="64" r="5" class="f-asp"/><text x="24" y="68" class="t2" font-size="11.5" >Asp carboxylate base</text><circle cx="160" cy="64" r="5" class="f-glu"/><text x="170" y="68" class="t2" font-size="11.5" >Glu carboxylate base</text><circle cx="306" cy="64" r="5" class="f-his"/><text x="316" y="68" class="t2" font-size="11.5" >His–Asp dyad</text><circle cx="403.2" cy="64" r="5" class="f-unk"/><text x="413.2" y="68" class="t2" font-size="11.5" >Base not retrieved</text><circle cx="19" cy="86" r="5" class="hol k-unk"/><text x="30" y="90" class="t2" font-size="11.5" >design / start</text><circle cx="139" cy="86" r="5.5" class="f-unk ring"/><text x="151" y="90" class="t2" font-size="11.5" >best reported</text><polygon points="259,80 265,86 259,92 253,86" class="hol k-unk"/><text x="271" y="90" class="t2" font-size="11.5" >derived or lower bound (≤ / ≥)</text><line class="grid" x1="311.3636363636364" x2="311.3636363636364" y1="102" y2="628"/><text x="311.3636363636364" y="646" class="t2" font-size="11" text-anchor="middle">10</text><line class="grid" x1="402.27272727272725" x2="402.27272727272725" y1="102" y2="628"/><text x="402.27272727272725" y="646" class="t2" font-size="11" text-anchor="middle">100</text><line class="grid" x1="493.18181818181813" x2="493.18181818181813" y1="102" y2="628"/><text x="493.18181818181813" y="646" class="t2" font-size="11" text-anchor="middle">1,000</text><line class="grid" x1="584.090909090909" x2="584.090909090909" y1="102" y2="628"/><text x="584.090909090909" y="646" class="t2" font-size="11" text-anchor="middle">10,000</text><line class="grid" x1="675" x2="675" y1="102" y2="628"/><text x="675" y="646" class="t2" font-size="11" text-anchor="middle">100,000</text><line class="grid" x1="765.909090909091" x2="765.909090909091" y1="102" y2="628"/><text x="765.909090909091" y="646" class="t2" font-size="11" text-anchor="middle">1,000,000</text><text x="14" y="126" class="t2" font-size="11" letter-spacing=".06em" font-weight="600">DIRECTED EVOLUTION (lab library screening)</text><line class="grid" x1="14" x2="886" y1="134" y2="134"/><g data-tip="HG3 → HG3.17&#10;xylanase (1GOR) · Asp127&#10;start: 125  →  end: 230,000&#10;Start: JACS 2024 abstract (HG3 = 125). End: web-search summary of Blomberg 2013; not verified in the paper text.&#10;17 rounds of evolution. HG-3 measured 425 in Privett 2012 under other conditions."><rect class="hit" x="0" y="145" width="900" height="36"/><text x="14" y="159" class="t1" font-size="12.5" font-weight="600">HG3 → HG3.17</text><text x="14" y="173" class="t2" font-size="11" >xylanase (1GOR) · Asp127</text><line class="stem k-asp" x1="411.0827284552778" x2="707.884348728872" y1="160" y2="160"/><circle cx="411.0827284552778" cy="160" r="5" class="hol k-asp"/><text x="401.0827284552778" y="164" class="t2" font-size="11.5" text-anchor="end">125</text><circle cx="707.884348728872" cy="160" r="5.5" class="f-asp ring"/><text x="718.884348728872" y="164" class="t1" font-size="12" font-weight="600">230,000</text></g><g data-tip="KE59&#10;IGPS (1A53) · Glu230&#10;start: 160  →  end: 60,430&#10;Khersonsky 2012 PNAS Table 1 (R13-3/11H, 5-nitrobenzisoxazole).&#10;13 rounds. With the more reactive 5,7-dichlorobenzisoxazole the same variant reaches 573,090."><rect class="hit" x="0" y="181" width="900" height="36"/><text x="14" y="195" class="t1" font-size="12.5" font-weight="600">KE59</text><text x="14" y="209" class="t2" font-size="11" >IGPS (1A53) · Glu230</text><line class="stem k-glu" x1="420.82908933235683" x2="655.1138722044052" y1="196" y2="196"/><circle cx="420.82908933235683" cy="196" r="5" class="hol k-glu"/><text x="410.82908933235683" y="200" class="t2" font-size=