<text x="300" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7F8E99">BACKBONE</text>
<text x="260" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">RFdiffusion3</text>
<text x="260" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">all-atom motif</text>
<text x="260" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">scaffolding, 260 aa</text>
