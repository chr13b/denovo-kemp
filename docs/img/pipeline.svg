<text x="56" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#0151E2">0.28 Å</text>
<text x="56" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7F8E99">base-contact window</text>
<path d="M 228.0 190.0 L 236.0 200.0 L 228.0 210.0" fill="none" stroke="#7F8E99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="244" y="76" width="180" height="248" rx="14" fill="#111B2E" stroke="#1E2B44"/>
