<text x="708" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7F8E99">COFOLD</text>
<text x="668" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Boltz-2</text>
<text x="668" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">one-fold screen,</text>
<text x="668" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">MSA-free</text>
<line x1="668" y1="234" x2="816" y2="234" stroke="#1E2B44"/>
<text x="668" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#01EE92">19 s</text>
<text x="668" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7F8E99">per fold</text>
<path d="M 840.0 190.0 L 848.0 200.0 L 840.0 210.0" fill="none" stroke="#7F8E99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="856" y="76" width="180" height="248" rx="14" fill="#111B2E" stroke="#1E2B44"/>
<rect x="872" y="76" width="148" height="4" rx="2" fill="#9EDE2E"/>
<circle cx="888" cy="112" r="14" fill="#9EDE2E"/>
<text x="888" y="117" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0B1220">5</text>
<text x="912" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7F8E99">REPLICATE</text>
<text x="872" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">5 seeds</text>
<text x="872" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">then fresh seeds,</text>
<text x="872" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">winner's-curse control</text>
<line x1="872" y1="234" x2="1020" y2="234" stroke="#1E2B44"/>
<text x="872" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#9EDE2E">8 of 20</text>
<text x="872" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7F8E99">stay good, fresh seeds</text>
