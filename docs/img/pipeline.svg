<text x="504" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7F8E99">SEQUENCE</text>
<text x="464" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">LigandMPNN</text>
<text x="464" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">steered logits,</text>
<text x="464" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">Asp / Gln pinned</text>
<line x1="464" y1="234" x2="612" y2="234" stroke="#1E2B44"/>
<text x="464" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#02C4F4">11 vs 1</text>
<text x="464" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7F8E99">good designs, steered</text>
<path d="M 636.0 190.0 L 644.0 200.0 L 636.0 210.0" fill="none" stroke="#7F8E99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
