<text x="96" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#7F8E99">TARGET</text>
<text x="56" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Asp + Gln + 6NT</text>
<text x="56" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">23 crystal structures,</text>
<text x="56" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#C9D3DB">43 ligand copies</text>
