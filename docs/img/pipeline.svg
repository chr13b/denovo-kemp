<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
<title id="t">How the pipeline works</title>
<desc id="d">Six stages from the catalytic motif to replicated designs: target, backbone, sequence, cofold, replicate, gates. Replicated parents feed back into the sequence stage.</desc>
<defs><linearGradient id="strip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0151E2"/><stop offset="0.2" stop-color="#02C4F4"/><stop offset="0.4" stop-color="#01EE92"/><stop offset="0.6" stop-color="#9EDE2E"/><stop offset="0.8" stop-color="#FE6101"/><stop offset="1" stop-color="#E32B06"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#C9D3DB"/></marker></defs>
<rect width="1280" height="470" rx="18" fill="#0B1220"/>
<text x="40" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7F8E99">FROM CATALYTIC MOTIF TO REPLICATED DESIGNS</text>
<rect x="960" y="26" width="280" height="26" rx="13" fill="#111B2E" stroke="#1E2B44"/>
<text x="1100" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#C9D3DB">output: designs.fasta, at most 20</text>
