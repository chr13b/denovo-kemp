<text x="742.0" y="446" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#7F8E99">SCREEN</text>
<text x="1048.0" y="446" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#7F8E99">VERIFY</text>
